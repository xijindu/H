name: handy
description: "Handy — a cross-platform Telegram client (Flutter), built on TDLib."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2

  shared_preferences: ^2.3.2

  path_provider: ^2.1.4

  ffi: ^2.1.3

  intl: ^0.20.3

  lottie: ^3.5.1
  archive: ^4.2.0

  audio_session: ^0.2.4
  flutter_sound: 9.28.0
  logger: ^2.7.0
  record: ^7.1.1
  permission_handler: ^12.0.3

  image_picker: ^1.2.3
  camera: ^0.12.0+2
  file_picker: ^10.3.10
  geolocator: ^14.0.2

  qr_flutter: ^4.1.0

  dlibphonenumber: ^1.1.71

  sqlite3: ^3.5.2

  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  apple_maps_flutter: ^1.4.0

  video_player: ^2.14.0
  f_videoplayer:
    git:
      url: https://github.com/iebb/f-videoplayer.git
      ref: v0.5.8
      path: packages/f_videoplayer
  f_videoplayer_fvp:
    git:
      url: https://github.com/iebb/f-videoplayer.git
      ref: v0.5.8
      path: packages/f_videoplayer_fvp
  light_compressor_v2: ^1.9.0
  fvp: ^0.37.3
  f_videoplayer_pip:
    git:
      url: https://github.com/iebb/f-videoplayer.git
      ref: v0.5.8
      path: packages/f_videoplayer_pip
  flutter_local_notifications: ^22.2.0
  google_fonts: ^8.2.1
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  package_info_plus: ^9.0.1
  sentry_flutter: ^9.28.0
  http: ^1.6.0
  crypto: ^3.0.6
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.3
  image: ^4.9.2
  sensors_plus: ^7.1.0
  heroicons_flutter: ^0.5.0
  mobile_scanner: ^7.4.0
  flutter_math_fork: ^0.7.4
  wechat_assets_picker: ^10.1.3
  photo_manager: ^3.11.0
  flutter_secure_storage: ^10.3.1
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  local_auth: ^3.0.2
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.1

  video_player_platform_interface: any
dependency_overrides:
  fvp:
    git:
      url: https://github.com/iebb/f-videoplayer.git
      ref: v0.5.8
      path: third_party/fvp

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  ios: true
  android: true
  remove_alpha_ios: true
flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: false
  assets:
    - assets/app_icon.png
    - assets/emoji_preview/
